controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    # Dichiarazione dei controller attivi
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster



    arm_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController



# -----------------------------------------------------------------------------
# Configurazione Joint State Broadcaster
# -----------------------------------------------------------------------------
joint_state_broadcaster:
  ros__parameters:
    use_sim_time: true



# -----------------------------------------------------------------------------
# Configurazione Trajectory Controller (Braccio: j0, j1, j2, j3)
# -----------------------------------------------------------------------------
arm_trajectory_controller:
  ros__parameters:
    use_sim_time: true
    joints:
      - j0
      - j1
      - j2
      - j3
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    open_loop_control: false
    allow_partial_joints_goal: false
    constraints:
      stopped_velocity_tolerance: 0.01
      goal_time: 0.0
      j0: { trajectory: 0.0, goal: 0.05 }
      j1: { trajectory: 0.0, goal: 0.05 }
      j2: { trajectory: 0.0, goal: 0.05 }
      j3: { trajectory: 0.0, goal: 0.05 }

